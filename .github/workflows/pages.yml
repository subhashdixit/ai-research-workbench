name: CI and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-24.04
    env:
      PYLINTHOME: .pylint-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-installer.lock.txt"
      - run: "python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.lock.txt"
      - run: python -m pip check
      - run: python -m black --check backend
      - run: python -m pylint --rcfile backend/pyproject.toml backend/ai_gateway backend/wsgi.py
      - run: python -m pytest -q
        working-directory: backend
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run format
      - run: npm run lint
      - run: npm test
      - run: npm run check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
