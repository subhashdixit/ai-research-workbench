services:
  - type: web
    name: portfolio-ai-gateway
    runtime: python
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: "python -m pip install --require-hashes --only-binary=:all: -r requirements-installer.lock.txt && python -m pip install --require-hashes --only-binary=:all: -r backend/requirements.lock.txt"
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 75 wsgi:app
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: https://subhashdixit.github.io
